
name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target TectoneBusterCompMK1_VST3

      - name: Package
        shell: pwsh
        run: |
          $p = Get-ChildItem -Path build -Filter "*.vst3" -Recurse | Select-Object -First 1
          if (-not $p) { throw "VST3 bundle was not produced." }
          Compress-Archive -Path "$($p.FullName)\*" -DestinationPath TECTONE_BUSTER_COMP_MK1_Windows_VST3.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TECTONE-BUSTER-COMP-MK1-Windows-VST3
          path: TECTONE_BUSTER_COMP_MK1_Windows_VST3.zip
